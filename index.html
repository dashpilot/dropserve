<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DropServe</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
		<style>
			:root {
				--primary: #3b82f6;
				--primary-dark: #2563eb;
				--secondary: #6b7280;
				--success: #10b981;
				--danger: #ef4444;
				--bg-light: #f9fafb;
				--bg-dark: #111827;
				--text-dark: #1f2937;
				--text-light: #f9fafb;
				--border: #e5e7eb;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				line-height: 1.5;
				color: var(--text-dark);
				background-color: var(--bg-light);
				height: 100vh;
				display: flex;
				flex-direction: column;
			}

			.drop-container {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				height: 100%;
				width: 100%;
				padding: 2rem;
				text-align: center;
			}

			.drop-area {
				border: 3px dashed var(--border);
				border-radius: 1rem;
				padding: 3rem;
				max-width: 600px;
				width: 100%;
				transition: all 0.2s ease;
				background-color: white;
				box-shadow:
					0 4px 6px -1px rgba(0, 0, 0, 0.1),
					0 2px 4px -1px rgba(0, 0, 0, 0.06);
			}

			.drop-area.drag-over {
				border-color: var(--primary);
				background-color: rgba(59, 130, 246, 0.05);
				transform: scale(1.02);
			}

			.drop-area h1 {
				font-size: 2rem;
				margin-bottom: 1rem;
				color: var(--primary);
			}

			.drop-area p {
				color: var(--secondary);
				margin-bottom: 1.5rem;
			}

			.drop-area .logo {
				font-size: 3rem;
				margin-bottom: 1rem;
			}

			.button {
				background-color: var(--primary);
				color: white;
				border: none;
				padding: 0.75rem 1.5rem;
				border-radius: 0.5rem;
				font-size: 1rem;
				font-weight: 500;
				cursor: pointer;
				transition: background-color 0.2s ease;
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
			}

			.button:hover {
				background-color: var(--primary-dark);
			}

			.button.secondary {
				background-color: white;
				color: var(--primary);
				border: 1px solid var(--primary);
			}

			.button.secondary:hover {
				background-color: var(--bg-light);
			}

			.preview-container {
				flex-grow: 1;
				width: 100%;
				height: 100%;
				position: relative;
				overflow: hidden;
			}

			iframe {
				width: 100%;
				height: 100%;
				border: none;
				background-color: white;
			}

			.toolbar {
				position: fixed;
				top: 1rem;
				right: 1rem;
				display: flex;
				gap: 0.5rem;
				z-index: 100;
				opacity: 0.4;
				transition: opacity 0.2s ease;
			}

			.toolbar:hover {
				opacity: 1;
			}

			.toolbar button {
				background-color: var(--bg-dark);
				color: var(--text-light);
				border: none;
				width: 40px;
				height: 40px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				font-size: 1.25rem;
				box-shadow:
					0 4px 6px -1px rgba(0, 0, 0, 0.1),
					0 2px 4px -1px rgba(0, 0, 0, 0.06);
			}

			.loading-overlay {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.8);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 50;
				font-size: 1.25rem;
				color: var(--primary);
			}

			.spinner {
				width: 50px;
				height: 50px;
				border: 5px solid rgba(59, 130, 246, 0.2);
				border-radius: 50%;
				border-top-color: var(--primary);
				animation: spinner 1s ease-in-out infinite;
				margin-bottom: 1rem;
			}

			@keyframes spinner {
				to {
					transform: rotate(360deg);
				}
			}

			.message {
				position: fixed;
				bottom: 2rem;
				left: 50%;
				transform: translateX(-50%);
				padding: 0.75rem 1.5rem;
				border-radius: 0.5rem;
				font-weight: 500;
				box-shadow:
					0 4px 6px -1px rgba(0, 0, 0, 0.1),
					0 2px 4px -1px rgba(0, 0, 0, 0.06);
				z-index: 100;
				max-width: 600px;
				text-align: center;
			}

			.error {
				background-color: var(--danger);
				color: white;
			}

			.success {
				background-color: var(--success);
				color: white;
			}

			.info {
				background-color: var(--primary);
				color: white;
			}

			.fade-enter-active,
			.fade-leave-active {
				transition: opacity 0.3s;
			}

			.fade-enter-from,
			.fade-leave-to {
				opacity: 0;
			}
		</style>
	</head>
	<body x-data="dropServe()" x-init="init()">
		<!-- Drop Area Container (shown when no site is loaded) -->
		<div
			x-show="!siteLoaded"
			class="drop-container"
			x-transition:enter="fade-enter-active"
			x-transition:enter-start="fade-enter-from"
			x-transition:leave="fade-leave-active"
			x-transition:leave-end="fade-leave-to"
		>
			<div
				class="drop-area"
				x-bind:class="{ 'drag-over': isDragging }"
				x-on:dragover.prevent="isDragging = true"
				x-on:dragleave.prevent="isDragging = false"
				x-on:drop.prevent="handleDrop($event)"
			>
				<div class="logo">📦</div>
				<h1>DropServe</h1>
				<p>Drag your static site folder here to instantly preview it</p>
				<button class="button" x-on:click="selectFolder">Choose Folder</button>
			</div>
		</div>

		<!-- Preview Container (shown when site is loaded) -->
		<div
			x-show="siteLoaded"
			class="preview-container"
			x-transition:enter="fade-enter-active"
			x-transition:enter-start="fade-enter-from"
			x-transition:leave="fade-leave-active"
			x-transition:leave-end="fade-leave-to"
		>
			<iframe x-ref="previewFrame"></iframe>

			<div class="toolbar">
				<button x-on:click="resetApp" title="Choose another folder">↩</button>
				<button x-on:click="refreshPreview" title="Refresh preview">🔄</button>
			</div>
		</div>

		<!-- Loading Overlay -->
		<div
			x-show="loading"
			class="loading-overlay"
			x-transition:enter="fade-enter-active"
			x-transition:enter-start="fade-enter-from"
			x-transition:leave="fade-leave-active"
			x-transition:leave-end="fade-leave-to"
		>
			<div class="spinner"></div>
			<div x-text="loadingMessage"></div>
		</div>

		<!-- Error/Success Messages -->
		<div
			x-show="message.text"
			x-bind:class="['message', message.type]"
			x-transition:enter="fade-enter-active"
			x-transition:enter-start="fade-enter-from"
			x-transition:leave="fade-leave-active"
			x-transition:leave-end="fade-leave-to"
			x-text="message.text"
		></div>

		<script>
			function dropServe() {
				return {
					isDragging: false,
					siteLoaded: false,
					loading: false,
					loadingMessage: 'Loading...',
					message: {
						text: '',
						type: 'info',
						timeout: null
					},
					rootDirHandle: null,
					indexFileHandle: null,
					siteName: '',
					assetCache: {}, // Cache for assets like CSS, JS, images, etc.

					init() {
						// Check if the File System Access API is supported
						if (!('showDirectoryPicker' in window)) {
							this.showMessage(
								"Your browser doesn't support the File System Access API. Please use Chrome, Edge, or another Chromium-based browser.",
								'error'
							);
						}
					},

					async selectFolder() {
						try {
							const dirHandle = await window.showDirectoryPicker();
							this.processRootFolder(dirHandle);
						} catch (error) {
							if (error.name !== 'AbortError') {
								this.showMessage(`Error selecting folder: ${error.message}`, 'error');
								console.error(error);
							}
						}
					},

					async handleDrop(event) {
						this.isDragging = false;

						// Check if items are dropped
						const items = event.dataTransfer.items;
						if (!items || items.length === 0) {
							this.showMessage('No items were dropped', 'error');
							return;
						}

						// Process the first dropped item only
						const item = items[0];

						// Make sure it's a directory entry
						if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
							const entry = item.webkitGetAsEntry();

							if (entry && entry.isDirectory) {
								try {
									// Try to convert FileSystemEntry to FileSystemDirectoryHandle
									const dirHandle = await this.getDirectoryHandleFromDrop(entry);
									await this.processRootFolder(dirHandle);
								} catch (error) {
									this.showMessage(`Error processing dropped folder: ${error.message}`, 'error');
									console.error(error);
								}
							} else {
								this.showMessage('Please drop a folder, not a file', 'error');
							}
						} else {
							this.showMessage('Unsupported drop item', 'error');
						}
					},

					async getDirectoryHandleFromDrop(entry) {
						// For browsers that don't support direct conversion, try to use showDirectoryPicker
						try {
							const dirHandle = await window.showDirectoryPicker({
								id: 'dropserve',
								startIn: 'downloads'
							});
							return dirHandle;
						} catch (error) {
							throw new Error(
								"Couldn't access the dropped folder. Please use the 'Choose Folder' button instead."
							);
						}
					},

					async processRootFolder(dirHandle) {
						this.loading = true;
						this.loadingMessage = 'Looking for index.html...';
						this.rootDirHandle = dirHandle;
						this.siteName = dirHandle.name;

						try {
							// Find index.html in the root directory
							let indexFile = await this.findIndexFile(dirHandle);

							if (indexFile) {
								this.indexFileHandle = indexFile;
								await this.loadAndDisplayIndexFile(indexFile);
								this.siteLoaded = true;
								this.showMessage(`Site "${this.siteName}" loaded successfully!`, 'success');
							} else {
								throw new Error(`No index.html found in "${this.siteName}" folder`);
							}
						} catch (error) {
							this.showMessage(error.message, 'error');
							console.error(error);
						} finally {
							this.loading = false;
						}
					},

					async findIndexFile(dirHandle) {
						const indexFileNames = ['index.html', 'index.htm', 'default.html', 'default.htm'];

						// Try to find an index file in the root directory
						for (const fileName of indexFileNames) {
							try {
								const fileHandle = await dirHandle.getFileHandle(fileName);
								return fileHandle;
							} catch (error) {
								// File not found, try the next one
							}
						}

						return null; // No index file found
					},

					async loadAndDisplayIndexFile(fileHandle) {
						this.loadingMessage = 'Processing index.html...';

						try {
							const file = await fileHandle.getFile();
							const content = await file.text();

							// Create a blob URL with the processed HTML
							const processedContent = await this.processHtml(content);
							const blob = new Blob([processedContent], { type: 'text/html' });
							const url = URL.createObjectURL(blob);

							// Display in the iframe
							this.$refs.previewFrame.src = url;
						} catch (error) {
							throw new Error(`Error loading index file: ${error.message}`);
						}
					},

					async processHtml(html) {
						// Process HTML content to handle asset references
						return html.replace(/(src|href)=["']([^"']+)["']/g, async (match, attribute, url) => {
							// Skip absolute URLs, data URLs, and anchors
							if (
								url.startsWith('http://') ||
								url.startsWith('https://') ||
								url.startsWith('//') ||
								url.startsWith('data:') ||
								url.startsWith('#')
							) {
								return match;
							}

							try {
								// Handle paths starting with / (root relative)
								if (url.startsWith('/')) {
									// Remove the leading slash to make it relative to the folder root
									const assetPath = url.substring(1);
									const assetUrl = await this.getAssetUrl(assetPath);
									return `${attribute}="${assetUrl}"`;
								}

								// Handle relative paths (assume they're relative to the index.html location)
								const assetUrl = await this.getAssetUrl(url);
								return `${attribute}="${assetUrl}"`;
							} catch (error) {
								console.warn(`Could not process asset: ${url}`, error);
								return match; // Keep the original reference if we can't process it
							}
						});
					},

					async getAssetUrl(path) {
						// Check if asset is already cached
						if (this.assetCache[path]) {
							return this.assetCache[path];
						}

						// Split the path into components
						const pathParts = path.split('/').filter((part) => part.length > 0);

						if (pathParts.length === 0) {
							throw new Error('Invalid asset path');
						}

						try {
							// Start from the root directory
							let currentHandle = this.rootDirHandle;

							// Navigate through the path components
							for (let i = 0; i < pathParts.length - 1; i++) {
								const part = pathParts[i];
								if (part === '..') {
									// Can't go up from root in this simplified model
									throw new Error('Cannot navigate above root directory');
								} else if (part !== '.') {
									// Get directory handle
									currentHandle = await currentHandle.getDirectoryHandle(part);
								}
							}

							// Get the file handle for the last path component
							const fileName = pathParts[pathParts.length - 1];
							const fileHandle = await currentHandle.getFileHandle(fileName);
							const file = await fileHandle.getFile();

							// Create a blob URL for the file
							const blobUrl = URL.createObjectURL(file);

							// Cache the asset URL
							this.assetCache[path] = blobUrl;

							return blobUrl;
						} catch (error) {
							console.error(`Error resolving asset path: ${path}`, error);
							throw error;
						}
					},

					refreshPreview() {
						if (this.indexFileHandle) {
							this.loadAndDisplayIndexFile(this.indexFileHandle);
							this.showMessage('Preview refreshed', 'info');
						}
					},

					resetApp() {
						// Revoke all cached asset URLs
						Object.values(this.assetCache).forEach((url) => {
							URL.revokeObjectURL(url);
						});

						// Reset all state variables
						this.siteLoaded = false;
						this.rootDirHandle = null;
						this.indexFileHandle = null;
						this.siteName = '';
						this.assetCache = {};

						// Clear any existing iframe content
						if (this.$refs.previewFrame) {
							this.$refs.previewFrame.src = 'about:blank';
						}
					},

					showMessage(text, type = 'info') {
						// Clear any existing timeout
						if (this.message.timeout) {
							clearTimeout(this.message.timeout);
						}

						// Set the message
						this.message.text = text;
						this.message.type = type;

						// Auto-hide after 5 seconds
						this.message.timeout = setTimeout(() => {
							this.message.text = '';
						}, 5000);
					}
				};
			}
		</script>
	</body>
</html>
