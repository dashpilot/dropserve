<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DropServe</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.3/cdn.min.js" defer></script>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				height: 100vh;
				background-color: #f9fafb;
				display: flex;
				flex-direction: column;
			}

			.welcome-container {
				display: flex;
				justify-content: center;
				align-items: center;
				flex-direction: column;
				height: 100vh;
			}

			.drop-zone {
				width: 500px;
				max-width: 90vw;
				height: 400px;
				padding: 25px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				background: white;
				border-radius: 10px;
				box-shadow:
					0 0 0 1px rgba(0, 0, 0, 0.05),
					0 5px 15px rgba(0, 0, 0, 0.1);
				border: 2px dashed #e5e7eb;
				transition: all 0.2s ease;
			}

			.drop-zone.active {
				border-color: #4f46e5;
				background-color: rgba(79, 70, 229, 0.05);
			}

			.logo {
				width: 80px;
				height: 80px;
				margin-bottom: 20px;
			}

			.title {
				font-size: 32px;
				font-weight: 700;
				color: #4f46e5;
				margin-bottom: 10px;
			}

			.subtitle {
				color: #6b7280;
				margin-bottom: 30px;
			}

			.btn {
				background-color: #4f46e5;
				color: white;
				padding: 10px 20px;
				border-radius: 6px;
				border: none;
				font-size: 16px;
				font-weight: 500;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			.btn:hover {
				background-color: #4338ca;
			}

			.preview {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}

			.preview iframe {
				width: 100%;
				height: 100%;
				border: none;
			}

			.toolbar {
				position: fixed;
				top: 15px;
				right: 15px;
				z-index: 1000;
				display: flex;
				gap: 10px;
			}

			.toolbar-btn {
				width: 40px;
				height: 40px;
				border-radius: 20px;
				background-color: #1f2937;
				color: white;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				font-size: 18px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
			}

			.loading {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.8);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				z-index: 2000;
			}

			.spinner {
				width: 40px;
				height: 40px;
				border: 4px solid rgba(79, 70, 229, 0.1);
				border-radius: 50%;
				border-left-color: #4f46e5;
				animation: spin 1s ease infinite;
				margin-bottom: 20px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.toast {
				position: fixed;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				padding: 12px 20px;
				border-radius: 6px;
				color: white;
				font-weight: 500;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				z-index: 3000;
			}

			.toast.success {
				background-color: #10b981;
			}

			.toast.error {
				background-color: #ef4444;
			}

			.toast.info {
				background-color: #3b82f6;
			}
		</style>
	</head>
	<body>
		<div x-data="dropServe()">
			<!-- Welcome Screen -->
			<div
				class="welcome-container"
				x-show="!siteLoaded"
				x-transition:leave="transition ease-out duration-300"
				x-transition:leave-start="opacity-100"
				x-transition:leave-end="opacity-0"
			>
				<div

					x-on:dragover.prevent="isDragging = true"
					x-on:dragleave.prevent="isDragging = false"
					x-on:drop.prevent="handleDrop($event)"

					<h1 class="title">DropServe</h1>
					<p class="subtitle">Drag your static site folder here to instantly preview it</p>
					<button class="btn" x-on:click="selectFolder">Choose Folder</button>
				</div>
			</div>

			<!-- Preview Screen -->
			<div x-show="siteLoaded" class="preview">
				<iframe x-ref="previewFrame"></iframe>

				<div class="toolbar">
					<div class="toolbar-btn" x-on:click="resetApp" title="Choose another folder">↩</div>
					<div class="toolbar-btn" x-on:click="refreshPreview" title="Refresh preview">⟳</div>
				</div>
			</div>

			<!-- Loading Screen -->
			<div x-show="loading" class="loading">
				<div class="spinner"></div>
				<div x-text="loadingMessage"></div>
			</div>

			<!-- Toast Message -->
			<div
				x-show="toastVisible"
				x-transition:enter="transition ease-out duration-300"
				x-transition:enter-start="opacity-0 transform translate-y-2"
				x-transition:enter-end="opacity-100 transform translate-y-0"
				x-transition:leave="transition ease-in duration-200"
				x-transition:leave-start="opacity-100 transform translate-y-0"
				x-transition:leave-end="opacity-0 transform translate-y-2"
				x-bind:class="['toast', toastType]"
				x-text="toastMessage"
			></div>
		</div>

		<script>
			function dropServe() {
				return {
					// State
					isDragging: false,
					siteLoaded: false,
					loading: false,
					loadingMessage: 'Loading...',

					// Toast
					toastVisible: false,
					toastMessage: '',
					toastType: 'info',
					toastTimeout: null,

					// Site data
					rootDirHandle: null,
					indexFileHandle: null,
					siteName: '',
					assetCache: {},

					// Initialize
					init() {
						if (!('showDirectoryPicker' in window)) {
							this.showToast(
								"Your browser doesn't support the File System Access API. Please use Chrome, Edge, or another Chromium-based browser.",
								'error'
							);
						}
					},

					// Select folder via button
					async selectFolder() {
						try {
							const dirHandle = await window.showDirectoryPicker();
							await this.processFolder(dirHandle);
						} catch (error) {
							if (error.name !== 'AbortError') {
								this.showToast(`Error selecting folder: ${error.message}`, 'error');
								console.error(error);
							}
						}
					},

					// Handle drag and drop
					async handleDrop(event) {
						this.isDragging = false;

						const items = event.dataTransfer.items;
						if (!items || items.length === 0) {
							this.showToast('No items were dropped', 'error');
							return;
						}

						const item = items[0];

						if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
							const entry = item.webkitGetAsEntry();

							if (entry && entry.isDirectory) {
								try {
									const dirHandle = await this.getDirectoryHandleFromDrop(entry);
									await this.processFolder(dirHandle);
								} catch (error) {
									this.showToast(`Error processing dropped folder: ${error.message}`, 'error');
									console.error(error);
								}
							} else {
								this.showToast('Please drop a folder, not a file', 'error');
							}
						} else {
							this.showToast('Unsupported drop item', 'error');
						}
					},

					// Convert drop entry to directory handle
					async getDirectoryHandleFromDrop(entry) {
						try {
							const dirHandle = await window.showDirectoryPicker();
							return dirHandle;
						} catch (error) {
							throw new Error(
								"Couldn't access the dropped folder. Please use the 'Choose Folder' button instead."
							);
						}
					},

					// Process the selected folder
					async processFolder(dirHandle) {
						this.loading = true;
						this.loadingMessage = 'Looking for index.html...';
						this.rootDirHandle = dirHandle;
						this.siteName = dirHandle.name;

						try {
							let indexFile = await this.findIndexFile(dirHandle);

							if (indexFile) {
								this.indexFileHandle = indexFile;
								await this.processIndexFile(indexFile);
								this.siteLoaded = true;
								this.showToast(`Site "${this.siteName}" loaded successfully!`, 'success');
							} else {
								throw new Error(`No index.html found in "${this.siteName}" folder`);
							}
						} catch (error) {
							this.showToast(error.message, 'error');
							console.error(error);
						} finally {
							this.loading = false;
						}
					},

					// Find index.html file
					async findIndexFile(dirHandle) {
						const indexFileNames = ['index.html', 'index.htm', 'default.html', 'default.htm'];

						for (const fileName of indexFileNames) {
							try {
								const fileHandle = await dirHandle.getFileHandle(fileName);
								return fileHandle;
							} catch (error) {
								// File not found, try the next one
							}
						}

						return null;
					},

					// Process and display index.html
					async processIndexFile(fileHandle) {
						this.loadingMessage = 'Processing index.html...';

						try {
							const file = await fileHandle.getFile();
							const content = await file.text();

							this.loadingMessage = 'Processing assets...';
							const processedHtml = await this.processHtml(content);

							// Create a blob URL for the processed HTML
							const blob = new Blob([processedHtml], { type: 'text/html' });
							const url = URL.createObjectURL(blob);

							// Display in the iframe
							this.$refs.previewFrame.src = url;
						} catch (error) {
							throw new Error(`Error processing index file: ${error.message}`);
						}
					},

					// Process HTML to handle asset references
					async processHtml(html) {
						// Create a DOM parser to handle HTML
						const parser = new DOMParser();
						const doc = parser.parseFromString(html, 'text/html');

						// Add a base tag to help with relative paths
						const baseElement = doc.createElement('base');
						baseElement.href = '/';
						doc.head.insertBefore(baseElement, doc.head.firstChild);

						// Process CSS link tags
						const linkTags = doc.querySelectorAll('link[rel="stylesheet"]');
						for (const link of linkTags) {
							await this.processAssetReference(link, 'href');
						}

						// Process script tags
						const scriptTags = doc.querySelectorAll('script[src]');
						for (const script of scriptTags) {
							await this.processAssetReference(script, 'src');
						}

						// Process image tags
						const imgTags = doc.querySelectorAll('img[src]');
						for (const img of imgTags) {
							await this.processAssetReference(img, 'src');
						}

						return doc.documentElement.outerHTML;
					},

					// Process an individual asset reference
					async processAssetReference(element, attributeName) {
						const path = element.getAttribute(attributeName);

						// Skip external references
						if (
							!path ||
							path.startsWith('http://') ||
							path.startsWith('https://') ||
							path.startsWith('//') ||
							path.startsWith('data:') ||
							path.startsWith('blob:')
						) {
							return;
						}

						try {
							// Get blob URL for the asset
							const blobUrl = await this.getAssetUrl(path);

							// Update the element attribute
							element.setAttribute(attributeName, blobUrl);

							// Remove crossorigin attribute if present
							if (element.hasAttribute('crossorigin')) {
								element.removeAttribute('crossorigin');
							}
						} catch (error) {
							console.warn(`Could not process asset: ${path}`, error);
						}
					},

					// Resolve asset path and create blob URL
					async getAssetUrl(path) {
						// Check cache first
						if (this.assetCache[path]) {
							return this.assetCache[path];
						}

						// Remove leading slash if present
						const normalizedPath = path.startsWith('/') ? path.substring(1) : path;

						// Split path into components
						const pathParts = normalizedPath.split('/').filter((part) => part.length > 0);

						try {
							// Start from root directory
							let currentHandle = this.rootDirHandle;

							// Navigate through path components
							for (let i = 0; i < pathParts.length - 1; i++) {
								const part = pathParts[i];

								// Handle relative paths
								if (part === '..') {
									throw new Error('Cannot navigate above root directory');
								} else if (part !== '.') {
									try {
										currentHandle = await currentHandle.getDirectoryHandle(part);
									} catch (error) {
										throw new Error(`Directory not found: ${part}`);
									}
								}
							}

							// Get the file
							const fileName = pathParts[pathParts.length - 1];
							const fileHandle = await currentHandle.getFileHandle(fileName);
							const file = await fileHandle.getFile();

							// Determine content type
							const fileExt = fileName.split('.').pop().toLowerCase();
							let contentType = 'application/octet-stream';

							switch (fileExt) {
								case 'html':
								case 'htm':
									contentType = 'text/html';
									break;
								case 'css':
									contentType = 'text/css';
									break;
								case 'js':
									contentType = 'application/javascript';
									break;
								case 'json':
									contentType = 'application/json';
									break;
								case 'png':
									contentType = 'image/png';
									break;
								case 'jpg':
								case 'jpeg':
									contentType = 'image/jpeg';
									break;
								case 'gif':
									contentType = 'image/gif';
									break;
								case 'svg':
									contentType = 'image/svg+xml';
									break;
								case 'webp':
									contentType = 'image/webp';
									break;
								case 'woff':
									contentType = 'font/woff';
									break;
								case 'woff2':
									contentType = 'font/woff2';
									break;
								case 'ttf':
									contentType = 'font/ttf';
									break;
								case 'otf':
									contentType = 'font/otf';
									break;
							}

							// Create a blob with correct MIME type
							const fileContent = await file.arrayBuffer();
							const blob = new Blob([fileContent], { type: contentType });
							const blobUrl = URL.createObjectURL(blob);

							// Cache the URL
							this.assetCache[path] = blobUrl;

							return blobUrl;
						} catch (error) {
							console.error(`Error loading asset: ${path}`, error);
							throw error;
						}
					},

					// Refresh the preview
					refreshPreview() {
						if (this.indexFileHandle) {
							this.processIndexFile(this.indexFileHandle);
							this.showToast('Preview refreshed', 'info');
						}
					},

					// Reset the app
					resetApp() {
						// Revoke blob URLs
						Object.values(this.assetCache).forEach((url) => {
							URL.revokeObjectURL(url);
						});

						// Reset state
						this.siteLoaded = false;
						this.rootDirHandle = null;
						this.indexFileHandle = null;
						this.siteName = '';
						this.assetCache = {};

						// Clear iframe
						if (this.$refs.previewFrame) {
							this.$refs.previewFrame.src = 'about:blank';
						}
					},

					// Show toast message
					showToast(message, type = 'info') {
						// Clear any existing timeout
						if (this.toastTimeout) {
							clearTimeout(this.toastTimeout);
						}

						// Set message
						this.toastMessage = message;
						this.toastType = type;
						this.toastVisible = true;

						// Auto-hide after 4 seconds
						this.toastTimeout = setTimeout(() => {
							this.toastVisible = false;
						}, 4000);
					}
				};
			}
		</script>
	</body>
</html>
