<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Site Preview</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --secondary: #6b7280;
      --success: #10b981;
      --danger: #ef4444;
      --bg-light: #f9fafb;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: var(--text-dark);
      background-color: var(--bg-light);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }
    
    header {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .description {
      color: var(--text-light);
      margin-bottom: 1rem;
    }
    
    .drop-area {
      border: 2px dashed var(--border);
      border-radius: 0.5rem;
      padding: 3rem 2rem;
      text-align: center;
      margin-bottom: 2rem;
      transition: all 0.2s ease;
    }
    
    .drop-area.drag-over {
      border-color: var(--primary);
      background-color: rgba(59, 130, 246, 0.05);
    }
    
    .drop-area h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    
    .drop-area p {
      color: var(--text-light);
      margin-bottom: 1rem;
    }
    
    .drop-area button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    
    .drop-area button:hover {
      background-color: var(--primary-dark);
    }
    
    .preview-container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1rem;
      height: 70vh;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
    }
    
    .file-explorer {
      background-color: white;
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
    }
    
    .file-explorer h3 {
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    
    .file-tree {
      list-style: none;
    }
    
    .file-tree ul {
      padding-left: 1.5rem;
      margin-top: 0.25rem;
    }
    
    .file-tree li {
      margin-bottom: 0.25rem;
    }
    
    .file-tree-item {
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      transition: background-color 0.1s ease;
    }
    
    .file-tree-item:hover {
      background-color: var(--bg-light);
    }
    
    .file-tree-item.active {
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--primary);
    }
    
    .file-tree-item .icon {
      margin-right: 0.5rem;
      font-size: 0.875rem;
    }
    
    .file-tree-item .folder::before {
      content: "📁";
    }
    
    .file-tree-item.expanded .folder::before {
      content: "📂";
    }
    
    .file-tree-item .file::before {
      content: "📄";
    }
    
    .preview-frame {
      flex-grow: 1;
      background-color: white;
      position: relative;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .code-view {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 1rem;
    }
    
    pre {
      margin: 0;
      border-radius: 0.25rem;
    }
    
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875rem;
      white-space: pre-wrap;
    }
    
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .toolbar button {
      background-color: white;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    
    .toolbar button:hover {
      background-color: var(--bg-light);
    }
    
    .toolbar button.selected {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    
    .toolbar .url-display {
      flex-grow: 1;
      margin: 0 1rem;
      padding: 0.5rem;
      background-color: white;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875rem;
      color: var(--text-light);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(59, 130, 246, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spinner 1s ease-in-out infinite;
    }
    
    @keyframes spinner {
      to {
        transform: rotate(360deg);
      }
    }
    
    .error-message {
      color: var(--danger);
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: 1px solid var(--danger);
      border-radius: 0.25rem;
      background-color: rgba(239, 68, 68, 0.05);
    }
    
    .success-message {
      color: var(--success);
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: 1px solid var(--success);
      border-radius: 0.25rem;
      background-color: rgba(16, 185, 129, 0.05);
    }
  </style>
</head>
<body x-data="staticSiteServer()">
  <div class="container">
    <header>
      <h1>Static Site Preview</h1>
      <p class="description">Drag and drop your static site folder to preview it directly in your browser. No server setup required!</p>
    </header>
    
    <template x-if="errorMessage">
      <div class="error-message" x-text="errorMessage"></div>
    </template>
    
    <template x-if="successMessage">
      <div class="success-message" x-text="successMessage"></div>
    </template>
    
    <div x-show="!rootFolder">
      <div
        class="drop-area"
        x-bind:class="{ 'drag-over': isDragging }"
        x-on:dragover.prevent="isDragging = true"
        x-on:dragleave.prevent="isDragging = false"
        x-on:drop.prevent="handleDrop($event)"
      >
        <h2>Drop your static site folder here</h2>
        <p>or</p>
        <button x-on:click="selectFolder">Choose Folder</button>
      </div>
    </div>
    
    <div x-show="rootFolder">
      <div class="toolbar">
        <button x-on:click="resetApp">Choose Another Folder</button>
        <div class="url-display" x-text="currentFilePath"></div>
        <button 
          x-bind:class="{ 'selected': viewMode === 'preview' }" 
          x-on:click="viewMode = 'preview'"
          x-show="isPreviewable(currentFile)"
        >Preview</button>
        <button 
          x-bind:class="{ 'selected': viewMode === 'code' }" 
          x-on:click="viewMode = 'code'"
        >Code</button>
      </div>
      
      <div class="preview-container">
        <div class="file-explorer">
          <h3>Files</h3>
          <ul class="file-tree">
            <template x-for="item in fileTree" :key="item.path">
              <li>
                <template x-if="item.type === 'file'">
                  <div 
                    class="file-tree-item" 
                    x-bind:class="{ 'active': currentFilePath === item.path }"
                    x-on:click="openFile(item)"
                  >
                    <span class="icon file"></span>
                    <span x-text="item.name"></span>
                  </div>
                </template>
                <template x-if="item.type === 'directory'">
                  <div>
                    <div 
                      class="file-tree-item" 
                      x-bind:class="{ 'expanded': item.expanded }"
                      x-on:click="toggleFolder(item)"
                    >
                      <span class="icon folder"></span>
                      <span x-text="item.name"></span>
                    </div>
                    <template x-if="item.expanded">
                      <ul>
                        <template x-for="child in item.children" :key="child.path">
                          <li>
                            <template x-if="child.type === 'file'">
                              <div 
                                class="file-tree-item" 
                                x-bind:class="{ 'active': currentFilePath === child.path }"
                                x-on:click="openFile(child)"
                              >
                                <span class="icon file"></span>
                                <span x-text="child.name"></span>
                              </div>
                            </template>
                            <template x-if="child.type === 'directory'">
                              <div>
                                <div 
                                  class="file-tree-item" 
                                  x-bind:class="{ 'expanded': child.expanded }"
                                  x-on:click="toggleFolder(child)"
                                >
                                  <span class="icon folder"></span>
                                  <span x-text="child.name"></span>
                                </div>
                                <template x-if="child.expanded">
                                  <ul>
                                    <template x-for="grandchild in child.children" :key="grandchild.path">
                                      <li>
                                        <template x-if="grandchild.type === 'file'">
                                          <div 
                                            class="file-tree-item" 
                                            x-bind:class="{ 'active': currentFilePath === grandchild.path }"
                                            x-on:click="openFile(grandchild)"
                                          >
                                            <span class="icon file"></span>
                                            <span x-text="grandchild.name"></span>
                                          </div>
                                        </template>
                                        <template x-if="grandchild.type === 'directory'">
                                          <div>
                                            <div 
                                              class="file-tree-item" 
                                              x-bind:class="{ 'expanded': grandchild.expanded }"
                                              x-on:click="toggleFolder(grandchild)"
                                            >
                                              <span class="icon folder"></span>
                                              <span x-text="grandchild.name"></span>
                                            </div>
                                          </div>
                                        </template>
                                      </li>
                                    </template>
                                  </ul>
                                </template>
                              </div>
                            </template>
                          </li>
                        </template>
                      </ul>
                    </template>
                  </div>
                </template>
              </li>
            </template>
          </ul>
        </div>
        
        <div class="preview-frame">
          <template x-if="loading">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </template>
          
          <template x-if="viewMode === 'preview' && isPreviewable(currentFile)">
            <iframe x-ref="previewFrame"></iframe>
          </template>
          
          <template x-if="viewMode === 'code' || !isPreviewable(currentFile)">
            <div class="code-view">
              <pre><code x-ref="codeBlock" x-html="highlightedCode"></code></pre>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function staticSiteServer() {
      return {
        isDragging: false,
        rootFolder: null,
        rootDirHandle: null,
        fileTree: [],
        currentFile: null,
        currentFilePath: "",
        fileCache: {},
        viewMode: 'preview',
        loading: false,
        errorMessage: "",
        successMessage: "",
        highlightedCode: "",
        objectUrls: {},
        
        async init() {
          // Check if the File System Access API is supported
          if (!('showDirectoryPicker' in window)) {
            this.errorMessage = "Your browser doesn't support the File System Access API. Please use Chrome, Edge, or another Chromium-based browser.";
          }
        },
        
        async selectFolder() {
          try {
            const dirHandle = await window.showDirectoryPicker();
            await this.processRootFolder(dirHandle);
          } catch (error) {
            if (error.name !== 'AbortError') {
              this.errorMessage = `Error selecting folder: ${error.message}`;
              console.error(error);
            }
          }
        },
        
        async handleDrop(event) {
          this.isDragging = false;
          
          // Check if items are dropped
          const items = event.dataTransfer.items;
          if (!items || items.length === 0) {
            this.errorMessage = "No items were dropped";
            return;
          }
          
          // Process the first dropped item only
          const item = items[0];
          
          // Make sure it's a directory entry
          if (item.kind === 'file' && typeof item.webkitGetAsEntry === 'function') {
            const entry = item.webkitGetAsEntry();
            
            if (entry && entry.isDirectory) {
              try {
                // Convert FileSystemEntry to FileSystemDirectoryHandle
                const dirHandle = await this.getDirectoryHandleFromEntry(entry);
                await this.processRootFolder(dirHandle);
              } catch (error) {
                this.errorMessage = `Error processing dropped folder: ${error.message}`;
                console.error(error);
              }
            } else {
              this.errorMessage = "Please drop a folder, not a file";
            }
          } else {
            this.errorMessage = "Unsupported drop item";
          }
        },
        
        async getDirectoryHandleFromEntry(entry) {
          // For browsers that don't support direct conversion, try to use showDirectoryPicker
          try {
            const dirHandle = await window.showDirectoryPicker({
              id: 'static-site-server',
              startIn: 'downloads'
            });
            return dirHandle;
          } catch (error) {
            throw new Error("Couldn't access the dropped folder. Please use the 'Choose Folder' button instead.");
          }
        },
        
        async processRootFolder(dirHandle) {
          this.loading = true;
          this.errorMessage = "";
          this.successMessage = "";
          this.rootDirHandle = dirHandle;
          this.rootFolder = dirHandle.name;
          
          try {
            // Build the file tree
            this.fileTree = await this.buildFileTree(dirHandle, "");
            
            // Find index.html or similar at the root
            let indexFile = null;
            for (const item of this.fileTree) {
              if (item.type === 'file' && this.isIndexFile(item.name)) {
                indexFile = item;
                break;
              }
            }
            
            if (indexFile) {
              await this.openFile(indexFile);
              this.successMessage = `Folder "${this.rootFolder}" loaded successfully! Found index file: ${indexFile.name}`;
            } else {
              // If no index file found, open the first file
              for (const item of this.fileTree) {
                if (item.type === 'file') {
                  await this.openFile(item);
                  this.successMessage = `Folder "${this.rootFolder}" loaded successfully!`;
                  break;
                }
              }
            }
          } catch (error) {
            this.errorMessage = `Error processing folder: ${error.message}`;
            console.error(error);
          } finally {
            this.loading = false;
          }
        },
        
        isIndexFile(filename) {
          const indexFiles = ['index.html', 'index.htm', 'default.html', 'default.htm'];
          return indexFiles.includes(filename.toLowerCase());
        },
        
        async buildFileTree(dirHandle, path) {
          const entries = [];
          
          try {
            for await (const [name, handle] of dirHandle.entries()) {
              const itemPath = path ? `${path}/${name}` : name;
              
              if (handle.kind === 'file') {
                entries.push({
                  name,
                  path: itemPath,
                  type: 'file',
                  handle
                });
              } else if (handle.kind === 'directory') {
                const children = await this.buildFileTree(handle, itemPath);
                entries.push({
                  name,
                  path: itemPath,
                  type: 'directory',
                  expanded: false,
                  handle,
                  children
                });
              }
            }
          } catch (error) {
            console.error(`Error building file tree for ${path}:`, error);
          }
          
          // Sort entries: directories first, then files, all alphabetically
          return entries.sort((a, b) => {
            if (a.type === b.type) {
              return a.name.localeCompare(b.name);
            }
            return a.type === 'directory' ? -1 : 1;
          });
        },
        
        async openFile(file) {
          if (!file) return;
          
          this.loading = true;
          this.currentFile = file;
          this.currentFilePath = file.path;
          
          try {
            // Check if file content is cached
            if (!this.fileCache[file.path]) {
              const fileHandle = file.handle;
              const fileContent = await this.readFileContent(fileHandle);
              this.fileCache[file.path] = fileContent;
            }
            
            // Get file content from cache
            const fileContent = this.fileCache[file.path];
            
            // If it's a text file, display as code
            if (this.isTextFile(file.name)) {
              // Use highlight.js to syntax highlight the code
              const fileExtension = this.getFileExtension(file.name);
              let language = this.getLanguageFromExtension(fileExtension);
              
              try {
                if (language) {
                  this.highlightedCode = hljs.highlight(fileContent, { language }).value;
                } else {
                  this.highlightedCode = hljs.highlightAuto(fileContent).value;
                }
              } catch (error) {
                // If highlighting fails, show plain text
                this.highlightedCode = this.escapeHtml(fileContent);
              }
            } else {
              // For binary files, just show a message
              this.highlightedCode = `<span style="color: #999;">[Binary file: ${file.name}]</span>`;
            }
            
            // If in preview mode and file is previewable, update the iframe
            if (this.viewMode === 'preview' && this.isPreviewable(file)) {
              await this.updatePreview(file);
            }
          } catch (error) {
            this.errorMessage = `Error opening file "${file.path}": ${error.message}`;
            console.error(error);
          } finally {
            this.loading = false;
          }
        },
        
        async updatePreview(file) {
          // If we have an existing object URL, revoke it
          if (this.objectUrls[file.path]) {
            URL.revokeObjectURL(this.objectUrls[file.path]);
          }
          
          const fileContent = this.fileCache[file.path];
          let contentType;
          
          // Determine content type based on file extension
          switch (this.getFileExtension(file.name)) {
            case 'html':
            case 'htm':
              contentType = 'text/html';
              break;
            case 'js':
              contentType = 'application/javascript';
              break;
            case 'css':
              contentType = 'text/css';
              break;
            case 'json':
              contentType = 'application/json';
              break;
            case 'txt':
              contentType = 'text/plain';
              break;
            case 'svg':
              contentType = 'image/svg+xml';
              break;
            case 'png':
              contentType = 'image/png';
              break;
            case 'jpg':
            case 'jpeg':
              contentType = 'image/jpeg';
              break;
            case 'gif':
              contentType = 'image/gif';
              break;
            default:
              contentType = 'text/plain';
          }
          
          // Create a blob with the file content and content type
          const blob = new Blob([fileContent], { type: contentType });
          
          // Create an object URL for the blob
          const objectUrl = URL.createObjectURL(blob);
          this.objectUrls[file.path] = objectUrl;
          
          // Set the iframe src to the object URL
          if (this.$refs.previewFrame) {
            // For HTML files, we need to handle relative imports
            if (contentType === 'text/html') {
              // Preprocess HTML to handle relative imports
              const modifiedHtml = await this.processHtmlRelativeImports(fileContent, file.path);
              const htmlBlob = new Blob([modifiedHtml], { type: 'text/html' });
              const htmlUrl = URL.createObjectURL(htmlBlob);
              this.objectUrls[`${file.path}_processed`] = htmlUrl;
              this.$refs.previewFrame.src = htmlUrl;
            } else {
              this.$refs.previewFrame.src = objectUrl;
            }
          }
        },
        
        async processHtmlRelativeImports(html, filePath) {
          // For simplicity, we'll handle basic relative imports in HTML
          const modifiedHtml = html.replace(/(src|href)="([^"]+)"/g, (match, attribute, url) => {
            // Skip absolute URLs and data URLs
            if (url.startsWith('http://') || url.startsWith('https://') || 
                url.startsWith('//') || url.startsWith('data:') || url.startsWith('#')) {
              return match;
            }
            
            // Handle relative URLs
            const basePath = filePath.substring(0, filePath.lastIndexOf('/'));
            let fullPath = url;
            
            if (url.startsWith('./')) {
              fullPath = `${basePath}/${url.substring(2)}`;
            } else if (url.startsWith('../')) {
              // Handle "../" references
              let tempPath = basePath;
              let tempUrl = url;
              
              while (tempUrl.startsWith('../')) {
                tempPath = tempPath.substring(0, tempPath.lastIndexOf('/'));
                tempUrl = tempUrl.substring(3);
              }
              
              fullPath = `${tempPath}/${tempUrl}`;
            } else if (!url.startsWith('/')) {
              fullPath = `${basePath}/${url}`;
            } else {
              // URLs that start with '/' are relative to the root of the project
              fullPath = url.substring(1);
            }
            
            // Try to get the file from cache or load it
            return `${attribute}="ASSET_${fullPath}"`;
          });
          
          return modifiedHtml;
        },
        
        async readFileContent(fileHandle) {
          const file = await fileHandle.getFile();
          
          // Handle binary files
          if (this.isBinaryFile(file.name)) {
            return await file.arrayBuffer();
          }
          
          // Handle text files
          return await file.text();
        },
        
        toggleFolder(folder) {
          folder.expanded = !folder.expanded;
        },
        
        isTextFile(filename) {
          const textExtensions = [
            'txt', 'md', 'html', 'htm', 'css', 'js', 'json', 'xml', 'svg',
            'jsx', 'ts', 'tsx', 'vue', 'yaml', 'yml', 'sh', 'bash', 'py',
            'rb', 'java', 'c', 'cpp', 'cs', 'go', 'php', 'pl', 'swift',
            'rust', 'scss', 'less', 'sass', 'toml', 'ini', 'cfg', 'conf',
            'gitignore', 'editorconfig', 'babelrc', 'eslintrc'
          ];
          
          const extension = this.getFileExtension(filename);
          return textExtensions.includes(extension);
        },
        
        isBinaryFile(filename) {
          const extension = this.getFileExtension(filename);
          const binaryExtensions = [
            'png', 'jpg', 'jpeg', 'gif', 'bmp', 'ico', 'webp', 'tiff',
            'pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx',
            'zip', 'rar', 'tar', 'gz', '7z',
            'mp3', 'mp4', 'wav', 'ogg', 'webm',
            'ttf', 'otf', 'woff', 'woff2', 'eot'
          ];
          
          return binaryExtensions.includes(extension);
        },
        
        isPreviewable(file) {
          if (!file) return false;
          
          const extension = this.getFileExtension(file.name);
          const previewableExtensions = [
            'html', 'htm', 'svg', 'png', 'jpg', 'jpeg', 'gif', 'webp'
          ];
          
          return previewableExtensions.includes(extension);
        },
        
        getFileExtension(filename) {
          return filename.split('.').pop().toLowerCase();
        },
        
        getLanguageFromExtension(extension) {
          const languageMap = {
            'html': 'html',
            'htm': 'html',
            'css': 'css',
            'js': 'javascript',
            'jsx': 'javascript',
            'ts': 'typescript',
            'tsx': 'typescript',
            'json': 'json',
            'md': 'markdown',
            'xml': 'xml',
            'svg': 'xml',
            'py': 'python',
            'rb': 'ruby',
            'java': 'java',
            'c': 'c',
            'cpp': 'cpp',
            'cs': 'csharp',
            'go': 'go',
            'php': 'php',
            'swift': 'swift',
            'rust': 'rust',
            'scss': 'scss',
            'less': 'less',
            'yaml': 'yaml',
            'yml': 'yaml',
            'sh': 'bash',
            'bash': 'bash'
          };
          
          return languageMap[extension] || null;
        },
        
        escapeHtml(unsafe) {
          return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        },
        
        resetApp() {
          // Revoke all object URLs
          Object.values(this.objectUrls).forEach(url => {
            URL.revokeObjectURL(url);
          });
          
          this.rootFolder = null;
          this.rootDirHandle = null;
          this.fileTree = [];
          this.currentFile = null;
          this.currentFilePath = "";
          this.fileCache = {};
          this.objectUrls = {};
          this.errorMessage = "";
          this.successMessage = "";
        }
      };
    }
  </script>
</body>
